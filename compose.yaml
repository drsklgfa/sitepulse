name: sitepulse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sitepulse
      POSTGRES_USER: sitepulse
      POSTGRES_PASSWORD: sitepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitepulse -d sitepulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  demo-target:
    build:
      context: ./demo-target
    ports:
      - "8080:8080"
    volumes:
      - demo_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command: >-
      sh -c "alembic upgrade head && python -m app.cli &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend-env
      APP_ENV: development
      APP_VERSION: 1.0.0
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-production}
      DATABASE_URL: postgresql+psycopg://sitepulse:sitepulse@postgres:5432/sitepulse
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ALLOW_PRIVATE_NETWORKS: "true"
      ALLOWED_PRIVATE_HOSTS: demo-target,localhost
      DEMO_TARGET_BASE_URL: http://demo-target:8080
      SEED_DEMO_DATA: "true"
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DEFAULT_NOTIFICATION_EMAIL: demo@sitepulse.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo-target:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app beat --loglevel=INFO
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ./backend
    command: celery -A app.celery_app:celery_app flower --port=5555
    environment: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
        VITE_DEMO_TARGET_URL: http://localhost:8080
        VITE_DEMO_MODE: "false"
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  demo_data:
