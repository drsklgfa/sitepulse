[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepulse-backend"
version = "1.0.0"
description = "API, workers and scraping engine for SitePulse"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.17.2",
  "beautifulsoup4==4.14.3",
  "celery==5.6.3",
  "fastapi==0.128.2",
  "flower==2.0.1",
  "httpx==0.28.1",
  "playwright==1.61.0",
  "psycopg[binary]==3.3.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyJWT==2.13.0",
  "redis==8.0.1",
  "SQLAlchemy==2.0.50",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.13.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.coverage.run]
source = ["app"]
omit = ["app/celery_app.py", "app/tasks.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
